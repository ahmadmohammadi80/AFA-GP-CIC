name: AFA frozen gate-width diagnostic
on:
  push:
    paths:
      - 'research/six_issues_20261116/gate_sensitivity_20261119.py'
      - '.github/workflows/afa-gate-diagnostic.yml'
  pull_request:
    branches:
      - research/complete-six-issue-package-20261116
    paths:
      - 'research/six_issues_20261116/gate_sensitivity_20261119.py'
      - '.github/workflows/afa-gate-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Execute frozen-source gate sensitivity, matched 20 seeds
        run: python research/six_issues_20261116/gate_sensitivity_20261119.py --seeds 20 --out results/gate_sensitivity20.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afa-gate-sensitivity-diagnostic
          path: results/gate_sensitivity20.json
