name: AFA issue1 and exact two-step certificate integration gate
on:
  push:
    paths:
      - ".github/workflows/afa-six-issues-gate.yml"
      - "research/six_issues_20261116/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: cd research/six_issues_20261116 && python -m unittest test_issue1_ablation -v
      - run: cd research/six_issues_20261116 && python -m unittest test_integrated_two_step_certificate_20261118 -v
      - run: python research/six_issues_20261116/integrated_two_step_certificate_20261118.py --seeds 40 --budget 1510 --offset 20261116 > results/afa_exact_two_step_primary.json
      - run: python research/six_issues_20261116/integrated_two_step_certificate_20261118.py --seeds 40 --budget 1510 --offset 20270101 > results/afa_exact_two_step_holdout.json
      - run: python research/six_issues_20261116/issue1_ablation.py --seeds 40 --offset 20261116 --out results/issue1_training.json
      - run: python research/six_issues_20261116/issue1_ablation.py --seeds 40 --offset 20270101 --out results/issue1_holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afa-six-issues-and-exact-two-step-integration
          path: results/*.json
