name: AFA online two-step reproducibility
on:
  push:
    paths:
      - '.github/workflows/afa-online-two-step.yml'
      - 'research/six_issues_20261116/online_two_step_benchmark_20261118.py'
      - 'research/six_issues_20261116/test_online_two_step_benchmark_20261118.py'
      - 'research/six_issues_20261116/integrated_two_step_certificate_20261118.py'
      - 'verify_online_results_20261118.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: cd research/six_issues_20261116 && python -m unittest -v test_integrated_two_step_certificate_20261118 test_online_two_step_benchmark_20261118
      - run: mkdir -p results
      - run: python research/six_issues_20261116/online_two_step_benchmark_20261118.py --seeds 40 --budget 1510 --offset 20261116 --out results/online_primary40_3methods.json
      - run: python research/six_issues_20261116/online_two_step_benchmark_20261118.py --seeds 40 --budget 1510 --offset 20270101 --out results/online_holdout40_3methods.json
      - run: python research/six_issues_20261116/online_two_step_benchmark_20261118.py --seeds 20 --budget 1510 --offset 20261116 --cyclic --out results/online_cyclic20_3methods.json
      - run: python research/six_issues_20261116/online_two_step_benchmark_20261118.py --seeds 20 --budget 1510 --offset 20261116 --null --out results/online_null20_3methods.json
      - run: python verify_online_results_20261118.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afa-online-two-step-results
          path: results/online_*_3methods.json
