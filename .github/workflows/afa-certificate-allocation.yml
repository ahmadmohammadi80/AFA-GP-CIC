name: AFA certificate-aware allocation
on:
  push:
    paths:
      - ".github/workflows/afa-certificate-allocation.yml"
      - "research/certificate_allocation_20261116/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Tests
        run: |
          cd research/certificate_allocation_20261116
          python -m unittest -v test_edge_allocation
      - name: Matched budget experiments
        run: |
          python research/certificate_allocation_20261116/edge_allocation.py --trials 40 --pilot 100 --out results/edge_allocation.json
      - name: Store raw trials
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afa-certificate-allocation-results
          path: results/edge_allocation.json
          if-no-files-found: warn
